<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imparare Italiano - Ruota dei Verbi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .spin-transition { transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .loading-pulse { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="app" class="max-w-6xl mx-auto p-4 md:p-8">
        <div class="bg-white rounded-[2.5rem] shadow-2xl overflow-hidden grid grid-cols-1 lg:grid-cols-12 min-h-[750px]">
            
            <!-- Roleta -->
            <div class="lg:col-span-5 p-8 border-b lg:border-b-0 lg:border-r border-slate-100 flex flex-col items-center">
                <h1 class="text-3xl font-extrabold text-indigo-900 mb-8 flex items-center gap-2">
                    🇮🇹 Ruota dei Verbi
                </h1>

                <div class="relative mb-10">
                    <div class="absolute inset-0 bg-indigo-200 rounded-full scale-110 blur-3xl opacity-20"></div>
                    <canvas id="wheelCanvas" width="400" height="400" class="relative z-10 max-w-full transition-transform duration-[4000ms] cubic-bezier(0.15, 0, 0.15, 1)"></canvas>
                    <!-- Ponteiro -->
                    <div class="absolute -top-4 left-1/2 -translate-x-1/2 z-20 w-8 h-10 bg-slate-800" style="clip-path: polygon(50% 100%, 0 0, 100% 0);"></div>
                </div>

                <button id="spinBtn" class="w-full py-5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-xl shadow-lg transition-all active:scale-95 disabled:opacity-50">
                    GIRAR ROLETA
                </button>

                <div class="mt-10 w-full">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Verbos na lista</span>
                        <button id="resetBtn" class="text-slate-300 hover:text-red-500 transition-colors text-sm font-semibold underline">Reiniciar</button>
                    </div>
                    <div id="verbTags" class="flex flex-wrap gap-2"></div>
                </div>
            </div>

            <!-- Painel de Prática -->
            <div class="lg:col-span-7 p-8 flex flex-col bg-slate-50/30">
                <div id="emptyState" class="flex-1 flex flex-col items-center justify-center text-center p-10 bg-white rounded-3xl border-2 border-dashed border-slate-200">
                    <div class="text-6xl mb-4">🎯</div>
                    <h3 class="text-xl font-bold text-slate-800">Pronto para começar?</h3>
                    <p class="text-slate-500 max-w-xs mx-auto mt-2 text-sm leading-relaxed">Gire a roleta para selecionar um verbo e praticar a conjugação.</p>
                </div>

                <div id="practiceArea" class="hidden space-y-6">
                    <div class="bg-gradient-to-br from-indigo-600 to-indigo-800 text-white p-8 rounded-3xl shadow-xl flex justify-between items-center">
                        <div>
                            <span class="text-[10px] font-bold uppercase tracking-widest opacity-70">Verbo Infinito</span>
                            <h2 id="currentVerbIt" class="text-5xl font-black tracking-tight"></h2>
                            <p id="currentVerbPt" class="text-indigo-100 text-lg italic mt-1 font-medium"></p>
                        </div>
                        <div class="bg-white/10 p-4 rounded-2xl backdrop-blur-md text-center border border-white/20">
                            <span class="block text-[10px] font-bold">PRESENTE</span>
                            <span class="text-xs font-medium">INDICATIVO</span>
                        </div>
                    </div>

                    <!-- Conjugação -->
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                        <div id="conjLoading" class="flex flex-col items-center py-4 text-slate-400">
                            <div class="w-6 h-6 border-4 border-indigo-400 border-t-transparent rounded-full animate-spin mb-2"></div>
                            <span class="text-[10px] font-bold uppercase">Buscando conjugação...</span>
                        </div>
                        <div id="conjGrid" class="hidden grid grid-cols-2 md:grid-cols-3 gap-3"></div>
                    </div>

                    <!-- Input de Frase -->
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                        <label class="block text-sm font-bold text-slate-700">Tente usar o verbo em uma frase:</label>
                        <textarea id="sentenceInput" class="w-full p-4 rounded-xl border border-slate-200 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50 outline-none transition-all min-h-[120px]" placeholder="Ex: Io parlo italiano molto bene..."></textarea>
                        
                        <button id="verifyBtn" class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold text-lg shadow-md transition-all flex items-center justify-center gap-2">
                            <span>Corrigir Frase</span>
                        </button>
                    </div>

                    <!-- Feedback -->
                    <div id="feedbackArea" class="hidden p-6 rounded-3xl border-2 transition-all">
                        <div class="flex gap-4">
                            <div id="feedbackIcon" class="p-3 rounded-full h-fit text-2xl bg-white shadow-sm"></div>
                            <div class="flex-1">
                                <h4 id="feedbackTitle" class="font-bold text-lg"></h4>
                                <div class="mt-3 space-y-4">
                                    <div>
                                        <p class="text-[10px] font-bold uppercase text-slate-400 tracking-wider">Sugestão</p>
                                        <p id="correctionText" class="text-slate-800 font-bold italic text-lg leading-snug"></p>
                                    </div>
                                    <div>
                                        <p class="text-[10px] font-bold uppercase text-slate-400 tracking-wider">Explicação do Professor</p>
                                        <p id="explanationText" class="text-slate-600 text-sm leading-relaxed"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent";

        const VERB_LIST = [
            { it: 'Parlare', pt: 'Falar' }, { it: 'Mangiare', pt: 'Comer' },
            { it: 'Vedere', pt: 'Ver' }, { it: 'Prendere', pt: 'Pegar' },
            { it: 'Dormire', pt: 'Dormir' }, { it: 'Andare', pt: 'Ir' },
            { it: 'Fare', pt: 'Fazer' }, { it: 'Uscire', pt: 'Sair' },
            { it: 'Sapere', pt: 'Saber' }, { it: 'Venire', pt: 'Vir' },
            { it: 'Potere', pt: 'Poder' }, { it: 'Volere', pt: 'Querer' }
        ];

        const COLORS = ['#6366f1', '#8b5cf6', '#ec4899', '#f43f5e', '#f59e0b', '#10b981', '#06b6d4', '#3b82f6'];

        let verbs = [...VERB_LIST];
        let rotation = 0;
        let isSpinning = false;
        let currentVerb = null;

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        async function apiRequest(prompt, system = "") {
            let delay = 1000;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { responseMimeType: "application/json" }
            };
            if (system) payload.systemInstruction = { parts: [{ text: system }] };

            for (let i = 0; i < 5; i++) {
                try {
                    const resp = await fetch(`${API_URL}?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!resp.ok) throw new Error();
                    const data = await resp.json();
                    return JSON.parse(data.candidates[0].content.parts[0].text);
                } catch (e) {
                    if (i === 4) throw e;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }
        }

        function drawWheel() {
            const size = canvas.width;
            const center = size / 2;
            const radius = center - 5;
            ctx.clearRect(0, 0, size, size);

            if (verbs.length === 0) return;

            const sliceAngle = (2 * Math.PI) / verbs.length;
            verbs.forEach((verb, i) => {
                const angle = i * sliceAngle;
                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, angle, angle + sliceAngle);
                ctx.fillStyle = COLORS[i % COLORS.length];
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Inter';
                ctx.fillText(verb.it, radius - 20, 6);
                ctx.restore();
            });

            ctx.beginPath();
            ctx.arc(center, center, 20, 0, 2*Math.PI);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.stroke();
        }

        async function loadConjugation(verb) {
            const grid = document.getElementById('conjGrid');
            const loading = document.getElementById('conjLoading');
            loading.classList.remove('hidden');
            grid.classList.add('hidden');

            try {
                const res = await apiRequest(`Conjuga "${verb}" em italiano no presente indicativo (formas io, tu, lui/lei, noi, voi, loro).`);
                grid.innerHTML = Object.entries(res).map(([k, v]) => `
                    <div class="p-3 bg-slate-50 rounded-xl border border-slate-100">
                        <span class="text-[9px] font-black text-slate-400 block uppercase">${k}</span>
                        <span class="text-indigo-900 font-bold">${v}</span>
                    </div>
                `).join('');
                loading.classList.add('hidden');
                grid.classList.remove('hidden');
            } catch (e) {
                loading.innerHTML = '<span class="text-red-500 text-xs font-bold">Erro ao carregar.</span>';
            }
        }

        function spin() {
            if (isSpinning || verbs.length === 0) return;
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('feedbackArea').classList.add('hidden');
            document.getElementById('sentenceInput').value = '';

            const spinAmount = (Math.PI * 2 * 5) + (Math.random() * Math.PI * 2);
            rotation += spinAmount;
            canvas.style.transform = `rotate(${rotation}rad)`;

            setTimeout(() => {
                const sliceAngle = (2 * Math.PI) / verbs.length;
                const actualRotation = (2 * Math.PI - (rotation % (2 * Math.PI))) % (2 * Math.PI);
                // Ajuste para o ponteiro estar no topo (1.5 * PI)
                const offset = (Math.PI * 1.5);
                let index = Math.floor(((actualRotation + offset) % (2 * Math.PI)) / sliceAngle);
                index = (verbs.length - index) % verbs.length;
                
                currentVerb = verbs[index];
                
                document.getElementById('emptyState').classList.add('hidden');
                document.getElementById('practiceArea').classList.remove('hidden');
                document.getElementById('currentVerbIt').innerText = currentVerb.it.toUpperCase();
                document.getElementById('currentVerbPt').innerText = currentVerb.pt;
                
                loadConjugation(currentVerb.it);
                
                verbs.splice(index, 1);
                updateTags();
                isSpinning = false;
                if (verbs.length > 0) document.getElementById('spinBtn').disabled = false;
            }, 4000);
        }

        async function verifySentence() {
            const text = document.getElementById('sentenceInput').value.trim();
            if (!text || !currentVerb) return;

            const btn = document.getElementById('verifyBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-pulse">Analisando...</span>';

            try {
                const res = await apiRequest(
                    `Frase: "${text}". Verbo: "${currentVerb.it}".`,
                    "És um tutor de italiano. Analisa a frase. Retorna JSON: { 'correct': boolean, 'correction': 'frase ideal', 'explanation': 'explicação gramatical em português de Portugal' }"
                );

                const area = document.getElementById('feedbackArea');
                const icon = document.getElementById('feedbackIcon');
                const title = document.getElementById('feedbackTitle');
                
                area.classList.remove('hidden');
                if (res.correct) {
                    area.className = "p-6 rounded-3xl border-2 bg-emerald-50 border-emerald-200 block";
                    icon.innerText = '✅';
                    title.innerText = 'Excelente!';
                    title.className = "font-bold text-lg text-emerald-800";
                } else {
                    area.className = "p-6 rounded-3xl border-2 bg-amber-50 border-amber-200 block";
                    icon.innerText = '✍️';
                    title.innerText = 'Vamos melhorar...';
                    title.className = "font-bold text-lg text-amber-800";
                }

                document.getElementById('correctionText').innerText = res.correction;
                document.getElementById('explanationText').innerText = res.explanation;
                area.scrollIntoView({ behavior: 'smooth' });
            } catch (e) {
                alert("Erro na conexão com o tutor.");
            } finally {
                btn.disabled = false;
                btn.innerText = 'Corrigir Frase';
            }
        }

        function updateTags() {
            const container = document.getElementById('verbTags');
            container.innerHTML = verbs.map(v => `
                <span class="px-3 py-1 bg-white rounded-full text-[10px] font-bold text-slate-400 border border-slate-200">${v.it}</span>
            `).join('');
        }

        document.getElementById('spinBtn').addEventListener('click', spin);
        document.getElementById('verifyBtn').addEventListener('click', verifySentence);
        document.getElementById('resetBtn').addEventListener('click', () => {
            verbs = [...VERB_LIST];
            rotation = 0;
            canvas.style.transform = 'rotate(0rad)';
            document.getElementById('emptyState').classList.remove('hidden');
            document.getElementById('practiceArea').classList.add('hidden');
            document.getElementById('spinBtn').disabled = false;
            updateTags();
            drawWheel();
        });

        updateTags();
        drawWheel();
    </script>
</body>
</html>
