<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imparare Italiano - Ruota dei Verbi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .spin-transition { transition: transform 3s cubic-bezier(0.15, 0, 0.15, 1); }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .loading-pulse { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="app" class="max-w-6xl mx-auto p-4 md:p-8">
        <div class="bg-white rounded-[2.5rem] shadow-2xl overflow-hidden grid grid-cols-1 lg:grid-cols-12 min-h-[700px]">
            
            <!-- Lado Esquerdo: Roleta -->
            <div class="lg:col-span-5 p-8 border-b lg:border-b-0 lg:border-r border-slate-100 flex flex-col items-center">
                <h1 class="text-3xl font-extrabold text-indigo-900 mb-8 flex items-center gap-2">
                    <span id="logo-icon">🇮🇹</span> Ruota dei Verbi
                </h1>

                <div class="relative mb-10 group">
                    <div class="absolute inset-0 bg-indigo-200 rounded-full scale-110 blur-3xl opacity-20"></div>
                    <canvas id="wheelCanvas" width="380" height="380" class="relative z-10 max-w-full drop-shadow-xl transition-transform"></canvas>
                    <div id="pointer" class="absolute top-1/2 -right-2 transform -translate-y-1/2 z-20 w-8 h-8 bg-slate-800 rotate-45" style="clip-path: polygon(100% 50%, 0 0, 0 100%);"></div>
                </div>

                <button id="spinBtn" class="w-full py-5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-xl shadow-lg transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                    GIRAR ROLETA
                </button>

                <div class="mt-10 w-full">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Verbos Restantes</span>
                        <button id="resetBtn" class="text-slate-300 hover:text-red-500 transition-colors text-sm font-semibold">Reiniciar</button>
                    </div>
                    <div id="verbTags" class="flex flex-wrap gap-2"></div>
                </div>
            </div>

            <!-- Lado Direito: Prática e Conjugação -->
            <div class="lg:col-span-7 p-8 flex flex-col bg-slate-50/30">
                <div id="emptyState" class="flex-1 flex flex-col items-center justify-center text-center p-10 bg-white rounded-3xl border-2 border-dashed border-slate-200">
                    <div class="text-6xl mb-4">🎲</div>
                    <h3 class="text-xl font-bold text-slate-800">Pronto para o desafio?</h3>
                    <p class="text-slate-500 max-w-xs mx-auto mt-2 text-sm leading-relaxed">Gire a roleta para sortear um verbo, veja sua conjugação e pratique criando uma frase.</p>
                </div>

                <div id="practiceArea" class="hidden space-y-6 animate-in fade-in slide-in-from-right-4 duration-500">
                    <!-- Cabeçalho do Verbo -->
                    <div class="bg-gradient-to-br from-indigo-600 to-indigo-800 text-white p-6 rounded-3xl shadow-xl flex justify-between items-center">
                        <div>
                            <span class="text-[10px] font-bold uppercase tracking-widest opacity-70">Verbo da vez</span>
                            <h2 id="currentVerbIt" class="text-4xl font-black">PARLARE</h2>
                            <p id="currentVerbPt" class="text-indigo-100 text-lg italic mt-1">Falar</p>
                        </div>
                        <div class="bg-white/10 p-3 rounded-2xl backdrop-blur-sm">
                            <span class="text-xs font-bold">PRESENTE INDICATIVO</span>
                        </div>
                    </div>

                    <!-- Quadro de Conjugação -->
                    <div id="conjugationBox" class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                        <div id="conjugationLoading" class="flex flex-col items-center py-4 text-slate-400">
                            <div class="w-6 h-6 border-4 border-indigo-400 border-t-transparent rounded-full animate-spin mb-2"></div>
                            <span class="text-xs font-semibold uppercase">Buscando conjugação...</span>
                        </div>
                        <div id="conjugationGrid" class="hidden grid grid-cols-2 md:grid-cols-3 gap-3">
                            <!-- Injetado via JS -->
                        </div>
                    </div>

                    <!-- Entrada de Texto -->
                    <div class="space-y-3 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                        <label class="block text-sm font-bold text-slate-700">Crie sua frase original:</label>
                        <textarea id="sentenceInput" class="w-full p-4 rounded-xl border border-slate-200 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50 outline-none transition-all min-h-[100px] text-base" placeholder="Escreva aqui..."></textarea>
                        
                        <button id="verifyBtn" class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold text-lg shadow-md transition-all flex items-center justify-center gap-2">
                            <span>Verificar Frase</span>
                        </button>
                    </div>

                    <!-- Feedback Area -->
                    <div id="feedbackArea" class="hidden p-6 rounded-3xl border-2 animate-in slide-in-from-top-4 duration-500">
                        <div class="flex gap-4">
                            <div id="feedbackIcon" class="p-3 rounded-full h-fit text-xl"></div>
                            <div class="flex-1">
                                <h4 id="feedbackTitle" class="font-bold text-lg"></h4>
                                <div class="mt-3 space-y-4">
                                    <div>
                                        <p class="text-[10px] font-bold uppercase text-slate-400 tracking-wider">Sugestão / Correção</p>
                                        <p id="correctionText" class="text-slate-800 font-semibold italic text-lg"></p>
                                    </div>
                                    <div>
                                        <p class="text-[10px] font-bold uppercase text-slate-400 tracking-wider">Explicação</p>
                                        <p id="explanationText" class="text-slate-600 text-sm leading-relaxed"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; // Substitua pela sua chave do Google AI Studio se hospedar externamente
        const INITIAL_VERBS = [
            { it: 'Parlare', pt: 'Falar' }, { it: 'Mangiare', pt: 'Comer' },
            { it: 'Vedere', pt: 'Ver' }, { it: 'Prendere', pt: 'Pegar/Tomar' },
            { it: 'Dormire', pt: 'Dormir' }, { it: 'Andare', pt: 'Ir' },
            { it: 'Fare', pt: 'Fazer' }, { it: 'Uscire', pt: 'Sair' },
            { it: 'Sapere', pt: 'Saber' }, { it: 'Venire', pt: 'Vir' }
        ];
        const COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316', '#64748b', '#a855f7'];

        let verbs = [...INITIAL_VERBS];
        let spinning = false;
        let rotation = 0;
        let selectedVerb = null;

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resetBtn = document.getElementById('resetBtn');
        const verifyBtn = document.getElementById('verifyBtn');
        const practiceArea = document.getElementById('practiceArea');
        const emptyState = document.getElementById('emptyState');
        const feedbackArea = document.getElementById('feedbackArea');

        function drawWheel() {
            const size = canvas.width;
            const center = size / 2;
            const radius = center - 10;
            ctx.clearRect(0, 0, size, size);

            if (verbs.length === 0) {
                ctx.fillStyle = '#cbd5e1';
                ctx.beginPath();
                ctx.arc(center, center, radius, 0, 2 * Math.PI);
                ctx.fill();
                return;
            }

            const sliceAngle = (2 * Math.PI) / verbs.length;
            verbs.forEach((verb, i) => {
                const angle = rotation + i * sliceAngle;
                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, angle, angle + sliceAngle);
                ctx.fillStyle = COLORS[i % COLORS.length];
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Inter';
                ctx.fillText(verb.it, radius - 30, 6);
                ctx.restore();
            });

            ctx.beginPath();
            ctx.arc(center, center, 20, 0, 2 * Math.PI);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#1e293b';
            ctx.stroke();
        }

        async function fetchConjugation(verb) {
            const loading = document.getElementById('conjugationLoading');
            const grid = document.getElementById('conjugationGrid');
            loading.classList.remove('hidden');
            grid.classList.add('hidden');

            const prompt = `Forneça a conjugação do verbo italiano "${verb}" no Presente do Indicativo. Retorne APENAS um objeto JSON com as chaves: io, tu, lui_lei, noi, voi, loro.`;
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                const conj = JSON.parse(data.candidates[0].content.parts[0].text);
                
                grid.innerHTML = `
                    <div class="p-3 bg-indigo-50 rounded-xl"><p class="text-[10px] text-indigo-400 font-bold uppercase">Io</p><p class="font-bold text-indigo-900">${conj.io}</p></div>
                    <div class="p-3 bg-indigo-50 rounded-xl"><p class="text-[10px] text-indigo-400 font-bold uppercase">Tu</p><p class="font-bold text-indigo-900">${conj.tu}</p></div>
                    <div class="p-3 bg-indigo-50 rounded-xl"><p class="text-[10px] text-indigo-400 font-bold uppercase">Lui/Lei</p><p class="font-bold text-indigo-900">${conj.lui_lei}</p></div>
                    <div class="p-3 bg-indigo-50 rounded-xl"><p class="text-[10px] text-indigo-400 font-bold uppercase">Noi</p><p class="font-bold text-indigo-900">${conj.noi}</p></div>
                    <div class="p-3 bg-indigo-50 rounded-xl"><p class="text-[10px] text-indigo-400 font-bold uppercase">Voi</p><p class="font-bold text-indigo-900">${conj.voi}</p></div>
                    <div class="p-3 bg-indigo-50 rounded-xl"><p class="text-[10px] text-indigo-400 font-bold uppercase">Loro</p><p class="font-bold text-indigo-900">${conj.loro}</p></div>
                `;
                
                loading.classList.add('hidden');
                grid.classList.remove('hidden');
            } catch (err) {
                loading.innerHTML = '<span class="text-red-500 text-xs">Erro ao carregar conjugação</span>';
            }
        }

        function spin() {
            if (spinning || verbs.length === 0) return;
            spinning = true;
            spinBtn.disabled = true;
            feedbackArea.classList.add('hidden');
            document.getElementById('sentenceInput').value = '';

            const extraSpins = 5 + Math.random() * 5;
            const spinRotation = extraSpins * 2 * Math.PI;
            const targetRotation = rotation + spinRotation;

            canvas.style.transition = 'transform 3s cubic-bezier(0.15, 0, 0.15, 1)';
            canvas.style.transform = `rotate(${targetRotation}rad)`;

            setTimeout(() => {
                rotation = targetRotation;
                const sliceAngle = (2 * Math.PI) / verbs.length;
                const normalized = (rotation % (2 * Math.PI));
                let index = Math.floor((2 * Math.PI - (normalized % (2 * Math.PI))) / sliceAngle) % verbs.length;
                if (index < 0) index += verbs.length;

                selectedVerb = verbs[index];
                
                emptyState.classList.add('hidden');
                practiceArea.classList.remove('hidden');
                document.getElementById('currentVerbIt').innerText = selectedVerb.it.toUpperCase();
                document.getElementById('currentVerbPt').innerText = selectedVerb.pt;
                
                fetchConjugation(selectedVerb.it);
                
                setTimeout(() => {
                    verbs.splice(index, 1);
                    updateTags();
                    drawWheel();
                    spinning = false;
                    spinBtn.disabled = verbs.length === 0;
                }, 1000);
            }, 3000);
        }

        async function verify() {
            const sentence = document.getElementById('sentenceInput').value.trim();
            if (!sentence || !selectedVerb) return;

            verifyBtn.disabled = true;
            verifyBtn.innerHTML = '<span class="loading-pulse">Analisando...</span>';

            const systemPrompt = "Você é um professor de italiano. Analise a frase do aluno. Retorne JSON: 'correct' (boolean), 'correction' (string frase sugerida), 'explanation' (explicação gramatical curta em português).";
            const userPrompt = `Verbo: ${selectedVerb.it}. Frase: "${sentence}"`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userPrompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                const feedback = JSON.parse(data.candidates[0].content.parts[0].text);
                
                feedbackArea.classList.remove('hidden');
                const icon = document.getElementById('feedbackIcon');
                const title = document.getElementById('feedbackTitle');
                
                if (feedback.correct) {
                    feedbackArea.className = "p-6 rounded-3xl border-2 bg-emerald-50 border-emerald-100 animate-in slide-in-from-top-4 duration-500";
                    icon.innerText = '✅';
                    title.innerText = 'Excelente!';
                    title.className = "font-bold text-lg text-emerald-800";
                } else {
                    feedbackArea.className = "p-6 rounded-3xl border-2 bg-amber-50 border-amber-100 animate-in slide-in-from-top-4 duration-500";
                    icon.innerText = '📝';
                    title.innerText = 'Dica do Tutor:';
                    title.className = "font-bold text-lg text-amber-800";
                }

                document.getElementById('correctionText').innerText = feedback.correction;
                document.getElementById('explanationText').innerText = feedback.explanation;
                feedbackArea.scrollIntoView({ behavior: 'smooth' });

            } catch (err) {
                alert("Erro ao conectar com a IA.");
            } finally {
                verifyBtn.disabled = false;
                verifyBtn.innerText = 'Verificar Frase';
            }
        }

        function updateTags() {
            const container = document.getElementById('verbTags');
            container.innerHTML = verbs.map(v => `
                <span class="px-3 py-1 bg-white rounded-full text-[11px] font-bold text-slate-400 border border-slate-200 shadow-sm">
                    ${v.it}
                </span>
            `).join('');
        }

        spinBtn.addEventListener('click', spin);
        resetBtn.addEventListener('click', () => {
            verbs = [...INITIAL_VERBS];
            selectedVerb = null;
            emptyState.classList.remove('hidden');
            practiceArea.classList.add('hidden');
            updateTags();
            drawWheel();
            spinBtn.disabled = false;
        });
        verifyBtn.addEventListener('click', verify);

        updateTags();
        drawWheel();
    </script>
</body>
</html>
